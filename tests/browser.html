<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Patina Lab browser tests</title></head><body><h1>Patina Lab browser tests</h1><pre id="result">Running…</pre><script>localStorage.removeItem('kata-patina-v1-qa')</script><iframe id="app" src="../?qa=1" width="1240" height="850" title="Application under test"></iframe><script type="module">
const frame=document.getElementById('app');await new Promise(r=>frame.onload=r);const w=frame.contentWindow,d=w.document,rows=[];const tick=()=>new Promise(r=>setTimeout(r,1500));function check(name,value){rows.push((value?'PASS':'FAIL')+' '+name);if(!value)throw Error(name);}const click=id=>d.getElementById(id).click(),change=(id,value)=>{const e=d.getElementById(id);e.value=value;e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));};try{await tick();check('Study renders with three texture layers',d.querySelectorAll('.layer').length===3&&d.getElementById('stage').width>500);const original=d.getElementById('uv').toDataURL();d.getElementById('uv').dispatchEvent(new KeyboardEvent('keydown',{code:'Space',key:' ',bubbles:true}));await tick();const painted=d.getElementById('uv').toDataURL();check('Keyboard painting changes texture',painted!==original);click('undo');await tick();check('Undo restores raster pixels',d.getElementById('uv').toDataURL()===original);click('redo');await tick();check('Redo restores raster pixels',d.getElementById('uv').toDataURL()===painted);click('add');check('Add layer creates fourth layer',d.querySelectorAll('.layer').length===4);change('opacity',55);check('Opacity updates selected layer',d.getElementById('opacity-value').textContent==='55%');click('remove');check('Remove layer retains three layers',d.querySelectorAll('.layer').length===3);d.querySelector('[data-finish="metal"]').click();check('Metal preset sets material properties',d.getElementById('metallic').value==='92');const img=d.getElementById('stage').toDataURL();d.getElementById('stage').dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await tick();check('Keyboard orbit changes preview',d.getElementById('stage').toDataURL()!==img);check('Keyboard orbit autosaves view',Math.abs(JSON.parse(w.localStorage.getItem('kata-patina-v1-qa')).yaw-.5)<1e-8);let blob;w.URL.createObjectURL=b=>(blob=b,'blob:test');w.HTMLAnchorElement.prototype.click=function(){};click('save');const saved=JSON.parse(await blob.text());check('Project export embeds raster layers',saved.layers.length===3&&saved.layers[0].png.startsWith('data:image/png'));saved.name='Imported surface';const dt=new DataTransfer();dt.items.add(new File([JSON.stringify(saved)],'test.patina',{type:'application/json'}));w.confirm=()=>true;d.getElementById('file').files=dt.files;d.getElementById('file').dispatchEvent(new Event('change'));await tick();check('Project import restores editable state',d.getElementById('material-name').textContent==='Imported surface');click('export');await tick();check('PNG map export produces image blob',blob.type==='image/png'&&blob.size>100);const bad=new DataTransfer();bad.items.add(new File(['{"version":99}'],'bad.patina'));d.getElementById('file').files=bad.files;d.getElementById('file').dispatchEvent(new Event('change'));await tick();check('Invalid import keeps current project',d.getElementById('status').textContent.includes('Could not open')&&d.getElementById('material-name').textContent==='Imported surface');click('sample');await new Promise(r=>{frame.onload=r;frame.src='../?qa=1&reload=1';});await tick();check('Autosave restores layered project after reload',frame.contentDocument.getElementById('material-name').textContent==='Tidal ceramic'&&frame.contentDocument.querySelectorAll('.layer').length===3);frame.contentWindow.localStorage.removeItem('kata-patina-v1-qa');rows.push('All '+rows.length+' checks passed.');}catch(e){rows.push('ERROR '+e.message);}document.getElementById('result').textContent=rows.join('\n');document.title=rows.some(x=>x.startsWith('FAIL')||x.startsWith('ERROR'))?'FAIL':'PASS';
</script></body></html>
